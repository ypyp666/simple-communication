[project]
name = "agent-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tiandicangsang69", email = "1309253364@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "cryptography>=50.0.2",
    "fastapi>=0.144.0",
    "ipykernel==7.3.0",
    "jupyterlab==4.6.3",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.12",
    "langchain-openai>=1.7.2",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "openai>=3.35.1",
    "pymysql>=1.2.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
agent-backend = "agent_backend:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
